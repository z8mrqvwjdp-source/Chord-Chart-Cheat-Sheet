<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Charts">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Cover Chart Finder</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap">
<style>
/* Layout: sticky search bar on top; landscape = song list left + big chart right; portrait/phone = list or chart, one at a time. Look follows the original Pages sheet: black, pink titles, teal / white / orange lines. */
:root{
  --bg:#000;--panel:#0d0d0f;--line:#26262b;--muted:#8d8d96;
  --pink:#ff42a1;--teal:#73fdea;--white:#fefffe;--orange:#feae00;
  --font:"Futura","Jost","Avenir Next",system-ui,sans-serif;
  --chart:2.6rem;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--white);font-family:var(--font);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{flex:1 1 220px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1.1rem}
#q::placeholder{color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:12px 16px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--white);color:#000}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px}
#list{overflow-y:auto;min-height:0;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.row .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:14px 4px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .t{color:var(--pink);font-weight:700;font-size:1.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .k{color:var(--white);font-weight:500;white-space:nowrap}
.row.sel{background:var(--panel)}
.row.sel .open{box-shadow:inset 3px 0 0 var(--pink);padding-left:12px}
.star{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted);font-size:.8rem;font-weight:500}
.star[aria-pressed="true"]{border-color:var(--orange);color:var(--orange)}
.empty{color:var(--muted);padding:24px 4px}
#chart{overflow-y:auto;min-height:0;min-width:0;padding-bottom:40px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.bar .back{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.bar .sp{flex:1}
.bar button.sm{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:500}
.bar button.sm[aria-pressed="true"]{border-color:var(--orange);color:var(--orange)}
.head{font-size:calc(var(--chart)*1.05);font-weight:700;line-height:1.15;text-wrap:balance;margin:8px 0 14px}
.head .t{color:var(--pink)}
.line{font-variant-numeric:tabular-nums;font-size:var(--chart);font-weight:700;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.c-t{color:var(--teal)}.c-w{color:var(--white)}.c-o{color:var(--orange);font-weight:500}.c-p{color:var(--pink)}
.tab{display:inline-block;width:1.7em}
.hint{color:var(--muted);font-size:1rem;padding:40px 4px}
@media (max-width:820px){
  body{overflow:auto;height:auto;min-height:100%}
  html,body{height:auto}
  main{display:block}
  #list{overflow:visible}
  body[data-view="chart"] #list,body[data-view="list"] #chart{display:none}
  .bar .back{display:inline-block}
  :root{--chart:2.1rem}
}
@media (max-width:820px) and (orientation:portrait){:root{--chart:1.9rem}}
@media (prefers-reduced-motion:no-preference){.row .open{transition:background .12s}}

.hbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:500}
.hbtn .dot{color:var(--orange)}
.panel{max-width:760px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:6px 0 0;font-size:1.5rem;color:var(--pink)}
.panel p{margin:0;color:var(--muted);line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px}
.field label{color:var(--muted);font-size:.9rem;font-weight:500}
.in{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1.1rem}
textarea.in{min-height:9rem;font-size:.9rem;font-family:ui-monospace,Menlo,monospace}
.eline{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.seg-row{display:flex;gap:8px;align-items:center}
.seg-row .in{flex:1;min-width:0;background:var(--bg)}
.sw{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.t{background:var(--teal)}.sw.w{background:var(--white)}.sw.o{background:var(--orange)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button,.panel button.sm{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:500}
.panel button.primary{background:var(--pink);border-color:var(--pink);color:#000;font-weight:700}
.panel button.danger[data-armed]{border-color:#ff5c5c;color:#ff5c5c}
.msg{color:var(--teal);min-height:1.2em}
.warn{color:var(--orange)}
.pv{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.pv .line{font-size:1.6rem}
.pv .head{font-size:1.7rem}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
</style>
</head>
<body>


<header>

  <div class="seg" role="group" aria-label="Show">
    <button id="m-all" type="button" aria-pressed="true">All <span id="n-all"></span></button>
    <button id="m-set" type="button" aria-pressed="false">Set <span id="n-set"></span></button>
  </div>
  <button id="b-new" class="hbtn" type="button">New</button>
  <button id="b-bak" class="hbtn" type="button">Backup</button>
</header>
<main>
  <nav id="list" aria-label="Songs"></nav>
  <section id="chart" aria-live="polite"></section>
</main>

const storeOK=store.set('_t','1');
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

let songs=[],meta={backedUp:null,changes:0},inSet=new Set(),mode='all',q='',sel=null,pane='chart',draft=null;
let size=parseFloat(store.get('size'))||2.6;document.documentElement.style.setProperty('--chart',size+'rem');

const uid=()=>'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const clone=o=>JSON.parse(JSON.stringify(o));
function baseCopy(){return BASE.map((s,i)=>({id:'b'+i,title:s.title,key:s.key,alias:ALIAS[s.title]||'',lines:clone(s.lines)}))}
function clean(s){ // returns a safe song or null
  if(!s||typeof s.title!=='string'||!Array.isArray(s.lines))return null;
  const lines=s.lines.map(l=>Array.isArray(l)?l.filter(p=>Array.isArray(p)&&typeof p[1]==='string').map(p=>[COLS.includes(p[0])?p[0]:'w',p[1]]):[]).filter(l=>l.length);
  return{id:typeof s.id==='string'&&/^[a-z0-9]+$/.test(s.id)?s.id:uid(),title:s.title.trim(),key:String(s.key||'').trim(),alias:String(s.alias||''),lines};
}
function load(){
  const raw=store.get('songs2');let ok=false;
  if(raw!==null){try{const j=JSON.parse(raw);if(Array.isArray(j)){songs=j.map(clean).filter(Boolean);ok=true}}catch(e){}}
  if(!ok)songs=baseCopy();
  try{Object.assign(meta,JSON.parse(store.get('meta2')||'{}'))}catch(e){}
  try{inSet=new Set(JSON.parse(store.get('set2')||'[]'))}catch(e){}
  inSet=new Set([...inSet].filter(id=>get(id)));
}
const get=id=>songs.find(s=>s.id===id);
function persist(){store.set('songs2',JSON.stringify(songs));store.set('meta2',JSON.stringify(meta))}
function changed(){meta.changes=(meta.changes||0)+1;persist()}
function saveSet(){store.set('set2',JSON.stringify([...inSet]))}

function visible(){
  const terms=norm(q).split(' ').filter(Boolean);
  return songs.filter(s=>(mode==='all'||inSet.has(s.id))&&terms.every(t=>norm(s.title+' '+s.key+' '+s.alias).includes(t)))
    .sort((a,b)=>sortKey(a.title).localeCompare(sortKey(b.title)));
}
function toggle(id){inSet.has(id)?inSet.delete(id):inSet.add(id);saveSet();renderList();if(pane==='chart'&&sel===id)renderChart()}

function renderList(){
  const box=$('list'),keep=box.scrollTop;box.textContent='';
  $('n-all').textContent=songs.length;$('n-set').textContent=inSet.size||'';
  $('b-bak').textContent='Backup';if(meta.changes>0){const d=el('span','dot',' •'+meta.changes);$('b-bak').append(d)}
  const list=visible();
  if(!list.length){box.append(el('div','empty',mode==='set'&&!inSet.size?'No songs in the set yet. Open a song and tap Add to set.':'No songs match.'));return}
  for(const s of list){
    const row=el('div','row'+(s.id===sel&&pane!=='backup'?' sel':''));
    const open=el('button','open');open.type='button';open.append(el('span','t',s.title),el('span','k',s.key));
    open.onclick=()=>{location.hash='s-'+s.id};
    const st=el('button','star',inSet.has(s.id)?'In set':'Add');st.type='button';
    st.setAttribute('aria-pressed',inSet.has(s.id));st.setAttribute('aria-label',(inSet.has(s.id)?'Remove ':'Add ')+s.title+(inSet.has(s.id)?' from set':' to set'));
    st.onclick=()=>toggle(s.id);
    row.append(open,st);box.append(row);
  }
  box.scrollTop=keep;
}

function renderLines(box,lines){
  for(const ln of lines){
    const d=el('div','line');
    for(const [c,t] of ln){
      const sp=el('span','c-'+c);
      t.split('\t').forEach((part,k)=>{if(k)sp.append(el('span','tab'));sp.append(document.createTextNode(part))});
      d.append(sp);
    }
    box.append(d);
  }
}
const mk=(t,f,cls)=>{const b=el('button',cls||'sm',t);b.type='button';b.onclick=f;return b};
function resize(d){size=Math.min(5,Math.max(1.2,+(size+d).toFixed(2)));document.documentElement.style.setProperty('--chart',size+'rem');store.set('size',size)}
function backBar(box,label,target){
  const bar=el('div','bar');const back=mk('‹ '+label,()=>{location.hash=target},'back');bar.append(back,el('span','sp'));box.append(bar);return bar;
}

function renderChart(){
  const box=$('chart');box.textContent='';
  const s=sel&&get(sel);
  if(!s){backBar(box,'Songs','');box.append(el('div','hint','Pick a song from the list, or tap New to add one.'));return}
  const bar=backBar(box,'Songs','');
  const a=mk('A−',()=>resize(-0.2)),b=mk('A+',()=>resize(0.2));a.setAttribute('aria-label','Smaller text');b.setAttribute('aria-label','Larger text');
  const add=mk(inSet.has(s.id)?'In set':'Add to set',()=>toggle(s.id));add.setAttribute('aria-pressed',inSet.has(s.id));
  bar.append(a,b,mk('Edit',()=>{location.hash='edit-'+s.id}),add);
  const head=el('div','head');head.append(el('span','t',s.title+' '),document.createTextNode(s.key));
  box.append(head);renderLines(box,s.lines);box.scrollTop=0;
}

/* ---------- editor ---------- */
const showText=t=>t.replace(/\t/g,' | ');
const readText=v=>v.split(/\s*\|\s*/).join('\t');
function renderEditor(){
  const box=$('chart');box.textContent='';
  const isNew=!get(draft.id);
  backBar(box,isNew?'Cancel':'Cancel',isNew?'':'s-'+draft.id);
  const p=el('div','panel');
  p.append(el('h2',null,isNew?'New song':'Edit song'));
  const f=(label,val,ph,key)=>{const w=el('div','field');const l=el('label',null,label);const i=el('input','in');i.type='text';i.value=val;i.placeholder=ph||'';i.id='f-'+key;l.htmlFor=i.id;
    i.autocapitalize='off';i.autocomplete='off';i.spellcheck=false;i.oninput=()=>{draft[key]=i.value;renderPreview()};w.append(l,i);return w};
  p.append(f('Title',draft.title,'e.g. Wagon Wheel','title'),f('Key',draft.key,'e.g. A','key'),f('Also search for (artist, full title)',draft.alias,'optional','alias'));
  const lab=el('div','field');lab.append(el('label',null,'Chart lines. Type a | between chords for a gap. Tap the circle to change colour.'));p.append(lab);
  draft.lines.forEach((ln,li)=>{
    const L=el('div','eline');
    ln.forEach((seg,si)=>{
      const r=el('div','seg-row');
      const sw=el('button','sw '+seg[0]);sw.type='button';sw.setAttribute('aria-label','Colour '+CNAME[seg[0]]+'. Tap to change.');
      sw.onclick=()=>{seg[0]=COLS[(COLS.indexOf(seg[0])+1)%3];renderEditor()};
      const i=el('input','in');i.type='text';i.value=showText(seg[1]);i.autocapitalize='off';i.autocomplete='off';i.spellcheck=false;i.setAttribute('aria-label','Line '+(li+1)+' part '+(si+1));
      i.oninput=()=>{seg[1]=readText(i.value);renderPreview()};
      r.append(sw,i);
      if(ln.length>1){const x=mk('✕',()=>{ln.splice(si,1);renderEditor()});x.setAttribute('aria-label','Remove this part');r.append(x)}
      L.append(r);
    });
    const tl=el('div','tools');
    tl.append(mk('+ part',()=>{ln.push([ln[ln.length-1][0],''],);renderEditor()}));
    if(li>0)tl.append(mk('↑',()=>{[draft.lines[li-1],draft.lines[li]]=[draft.lines[li],draft.lines[li-1]];renderEditor()}));
    if(li<draft.lines.length-1)tl.append(mk('↓',()=>{[draft.lines[li+1],draft.lines[li]]=[draft.lines[li],draft.lines[li+1]];renderEditor()}));
    tl.append(mk('Delete line',()=>{draft.lines.splice(li,1);if(!draft.lines.length)draft.lines.push([['t','']]);renderEditor()}));
    L.append(tl);p.append(L);
  });
  p.append(mk('+ Add line',()=>{const last=draft.lines[draft.lines.length-1];draft.lines.push([[last?last[last.length-1][0]:'t','']]);renderEditor()}));
  const msg=el('div','msg warn');msg.id='emsg';
  const act=el('div','tools');
  act.append(mk('Save',saveDraft,'sm primary'));
  act.append(mk('Cancel',()=>{location.hash=isNew?'':'s-'+draft.id}));
  if(!isNew)act.append(confirmBtn('Delete song','Tap again to delete',()=>{songs=songs.filter(s=>s.id!==draft.id);inSet.delete(draft.id);saveSet();changed();location.hash=''}));
  p.append(msg,act);
  const pv=el('div','pv');pv.id='pv';p.append(el('p',null,'Preview'),pv);
  box.append(p);renderPreview();box.scrollTop=0;
}
function renderPreview(){
  const pv=$('pv');if(!pv)return;pv.textContent='';
  const h=el('div','head');h.append(el('span','t',(draft.title||'Untitled')+' '),document.createTextNode(normKey(draft.key)));pv.append(h);
  renderLines(pv,tidy(draft.lines));
}
const normKey=k=>{k=(k||'').trim();return k&&!k.startsWith('(')?'('+k+')':k};
const tidy=lines=>lines.map(l=>l.filter(s=>s[1]!=='')).filter(l=>l.length);
function saveDraft(){
  const m=$('emsg');
  if(!draft.title.trim()){m.textContent='Add a title first.';return}
  const s={id:draft.id,title:draft.title.trim(),key:normKey(draft.key),alias:draft.alias.trim(),lines:tidy(draft.lines)};
  if(!s.lines.length){m.textContent='Add at least one chart line.';return}
  const i=songs.findIndex(x=>x.id===s.id);if(i>=0)songs[i]=s;else songs.push(s);
  changed();location.hash='s-'+s.id;
}
function confirmBtn(label,armed,fn){
  const b=el('button','sm danger',label);b.type='button';let t;
  b.onclick=()=>{if(b.dataset.armed){clearTimeout(t);fn()}else{b.dataset.armed='1';b.textContent=armed;t=setTimeout(()=>{delete b.dataset.armed;b.textContent=label},4000)}};
  return b;
}

/* ---------- backup ---------- */
async function copyText(ta){
  try{await navigator.clipboard.writeText(ta.value);return true}catch(e){}
  ta.focus();ta.select();try{return document.execCommand('copy')}catch(e){return false}
}
function renderBackup(){
  const box=$('chart');box.textContent='';backBar(box,'Songs','');
  const p=el('div','panel');p.append(el('h2',null,'Backup'));
  if(!storeOK)p.append(el('p','warn','This view can’t save changes. Edits will be lost when you close it.'));
  const when=meta.backedUp?new Date(meta.backedUp).toLocaleString():'never';
  p.append(el('p',null,songs.length+' songs. Changes since last backup: '+(meta.changes||0)+'. Last backup: '+when+'.'));
  p.append(el('p',null,'Your songs live in this browser only. Copy the backup below and paste it somewhere you keep, such as Notes. If the browser data is ever cleared, paste it back into Restore.'));
  const ta=el('textarea','in');ta.readOnly=true;ta.setAttribute('aria-label','Backup text');ta.value=JSON.stringify({app:'cover-chart-finder',version:2,songs});
  const m1=el('div','msg');
  const act=el('div','tools');
  act.append(mk('Copy backup',async()=>{
    if(await copyText(ta)){meta.backedUp=Date.now();meta.changes=0;persist();renderList();m1.textContent='Copied. Paste it into Notes or a file.';m1.className='msg'}
    else{m1.textContent='Couldn’t copy automatically. The text is selected: copy it by hand.';m1.className='msg warn'}
  },'sm primary'));
  p.append(ta,act,m1);
  p.append(el('h2',null,'Restore'));
  p.append(el('p',null,'Paste a backup here. Merge adds songs you don’t already have. Replace swaps your whole list.'));
  const ti=el('textarea','in');ti.placeholder='Paste backup text';ti.setAttribute('aria-label','Paste backup text');
  const m2=el('div','msg');
  const parse=()=>{try{let j=JSON.parse(ti.value);if(j&&!Array.isArray(j))j=j.songs;if(!Array.isArray(j))throw 0;const out=j.map(clean).filter(Boolean);if(!out.length)throw 0;return out}catch(e){m2.textContent='That isn’t a valid backup.';m2.className='msg warn';return null}};
  const a2=el('div','tools');
  a2.append(mk('Merge',()=>{const inc=parse();if(!inc)return;let add=0,skip=0;
      for(const s of inc){if(songs.some(x=>norm(x.title)===norm(s.title)&&norm(x.key)===norm(s.key))){skip++;continue}
        if(get(s.id))s.id=uid();songs.push(s);add++}
      if(add)changed();renderList();m2.className='msg';m2.textContent='Added '+add+', skipped '+skip+' already here.'}));
  a2.append(confirmBtn('Replace all','Tap again to replace',()=>{const inc=parse();if(!inc)return;songs=inc;inSet=new Set([...inSet].filter(id=>get(id)));saveSet();changed();renderList();m2.className='msg';m2.textContent='Replaced. '+songs.length+' songs.'}));
  p.append(ti,a2,m2);
  p.append(el('h2',null,'Start over'));
  p.append(el('p',null,'Go back to the original 70 songs from your Pages sheet. This discards your edits.'));
  const m3=el('div','msg');
  p.append(confirmBtn('Reset to original songs','Tap again to reset',()=>{songs=baseCopy();inSet=new Set();saveSet();changed();renderList();m3.textContent='Reset.'}),m3);
  box.append(p);box.scrollTop=0;
}

/* ---------- routing ---------- */
function route(){
  const h=location.hash;let m;sel=null;pane='chart';
  if((m=/^#s-([a-z0-9]+)$/.exec(h))&&get(m[1]))sel=m[1];
  else if((m=/^#edit-([a-z0-9]+)$/.exec(h))&&get(m[1])){sel=m[1];pane='edit';draft=clone(get(m[1]));draft.lines=clone(draft.lines)}
  else if(h==='#new'){pane='edit';draft={id:uid(),title:'',key:'',alias:'',lines:[[['t','']]]}}
  else if(h==='#backup')pane='backup';
  document.body.dataset.view=(pane==='chart'&&!sel)?'list':'chart';
  renderList();
  if(pane==='edit')renderEditor();else if(pane==='backup')renderBackup();else renderChart();
}
function setMode(m){mode=m;$('m-all').setAttribute('aria-pressed',m==='all');$('m-set').setAttribute('aria-pressed',m==='set');renderList()}
$('q').addEventListener('input',e=>{q=e.target.value;renderList()});
$('m-all').onclick=()=>setMode('all');$('m-set').onclick=()=>setMode('set');
$('b-new').onclick=()=>{location.hash='new'};$('b-bak').onclick=()=>{location.hash='backup'};
addEventListener('hashchange',route);
load();route();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
