<!doctype html>
<html lang="en" style="background:#141a1f">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Charts">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141a1f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Cover Chart Finder</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap">
<style>
/* Layout: sticky search bar on top; landscape = song list left + big chart right; portrait/phone = list or chart, one at a time. Look follows the original Pages sheet: black, pink titles, teal / white / orange lines. */
:root{
  --bg:#000;--panel:#0d0d0f;--line:#26262b;--muted:#8d8d96;
  --pink:#ff42a1;--teal:#73fdea;--white:#fefffe;--orange:#feae00;
  --font:"Futura","Jost","Avenir Next",system-ui,sans-serif;
  --chart:2.6rem;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--white);font-family:var(--font);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{flex:1 1 220px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1.1rem}
#q::placeholder{color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:12px 16px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--white);color:#000}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px}
#list{overflow-y:auto;min-height:0;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.row .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:14px 4px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .t{color:var(--pink);font-weight:700;font-size:1.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .k{color:var(--white);font-weight:500;white-space:nowrap}
.row.sel{background:var(--panel)}
.row.sel .open{box-shadow:inset 3px 0 0 var(--pink);padding-left:12px}
.star{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted);font-size:.8rem;font-weight:500}
.star[aria-pressed="true"]{border-color:var(--orange);color:var(--orange)}
.empty{color:var(--muted);padding:24px 4px}
#chart{overflow-y:auto;min-height:0;min-width:0;padding-bottom:40px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.bar .back{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.bar .sp{flex:1}
.bar button.sm{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:500}
.bar button.sm[aria-pressed="true"]{border-color:var(--orange);color:var(--orange)}
.head{font-size:calc(var(--chart)*1.05);font-weight:700;line-height:1.15;text-wrap:balance;margin:8px 0 14px}
.head .t{color:var(--pink)}
.line{font-variant-numeric:tabular-nums;font-size:var(--chart);font-weight:700;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.c-t{color:var(--teal)}.c-w{color:var(--white)}.c-o{color:var(--orange);font-weight:500}.c-p{color:var(--pink)}
.tab{display:inline-block;width:1.7em}
.hint{color:var(--muted);font-size:1rem;padding:40px 4px}
@media (max-width:820px){
  body{overflow:auto;height:auto;min-height:100%}
  html,body{height:auto}
  main{display:block}
  #list{overflow:visible}
  body[data-view="chart"] #list,body[data-view="list"] #chart{display:none}
  .bar .back{display:inline-block}
  :root{--chart:2.1rem}
}
@media (max-width:820px) and (orientation:portrait){:root{--chart:1.9rem}}
@media (prefers-reduced-motion:no-preference){.row .open{transition:background .12s}}

.hbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:500}
.hbtn .dot{color:var(--orange)}
.panel{max-width:760px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:6px 0 0;font-size:1.5rem;color:var(--pink)}
.panel p{margin:0;color:var(--muted);line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px}
.field label{color:var(--muted);font-size:.9rem;font-weight:500}
.in{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1.1rem}
textarea.in{min-height:9rem;font-size:.9rem;font-family:ui-monospace,Menlo,monospace}
.eline{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.seg-row{display:flex;gap:8px;align-items:center}
.seg-row .in{flex:1;min-width:0;background:var(--bg)}
.sw{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.t{background:var(--teal)}.sw.w{background:var(--white)}.sw.o{background:var(--orange)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button,.panel button.sm{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:500}
.panel button.primary{background:var(--pink);border-color:var(--pink);color:#000;font-weight:700}
.panel button.danger[data-armed]{border-color:#ff5c5c;color:#ff5c5c}
.msg{color:var(--teal);min-height:1.2em}
.warn{color:var(--orange)}
.pv{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.pv .line{font-size:1.6rem}
.pv .head{font-size:1.7rem}

/* ---- v4 look: charcoal ground, tinted controls (chart colours unchanged) ---- */
:root{--bg:#1f2328;--panel:#282d33;--panel2:#323840;--line:#3b424a;--muted:#a0a9b3;
  --blue:#3f6fd0;--blue-t:#a9c4f7;--blue-bg:#2a3753;--violet:#6a58b5;--violet-t:#cbbdf7;--violet-bg:#383152;--amber-bg:#46381a}
#q{background:var(--panel);border-color:var(--line)}
.seg{background:var(--panel);border-color:var(--line)}
.seg button{background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.hbtn{font-weight:700;border:1px solid transparent}
#b-new{background:var(--blue);color:#fff}
#b-bak{background:var(--violet-bg);color:var(--violet-t);border-color:var(--violet)}
#list{gap:6px}
.row{border:0;background:var(--panel);border-radius:12px;padding-right:8px}
.row:hover{background:var(--panel2)}
.row .open{padding:14px 12px}
.row .k{background:var(--panel2);border-radius:999px;padding:2px 10px;font-size:.95rem}
.row.sel{background:var(--blue-bg);box-shadow:inset 4px 0 0 var(--blue)}
.row.sel .open{box-shadow:none;padding-left:12px}
.row.sel .k{background:var(--blue);color:#fff}
.star{background:var(--panel2);border-color:var(--line);color:var(--muted)}
.star[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--orange);color:var(--orange)}
.bar button.sm,.bar .back{background:var(--panel2);border:1px solid var(--line);color:var(--white)}
.bar button.sm.edit{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-t)}
.bar button.sm[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--orange);color:var(--orange)}
.eline{background:var(--panel);border-color:var(--line)}
.tools button,.panel button.sm{background:var(--panel2);border:1px solid var(--line);color:var(--white)}
.panel button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.panel button.danger{color:#ff8f8f;border-color:#6b3a3a;background:#3a2b2e}
.panel button.danger[data-armed]{background:#ff5c5c;border-color:#ff5c5c;color:#1f2328}
.panel h2{color:var(--pink)}
.in{background:var(--panel)}
.seg-row .in{background:var(--bg)}
.sw{border-color:var(--bg);box-shadow:0 0 0 2px var(--line)}

/* ---- v5 palette: cyan #67f2ff, amber #ffc067, purple #7467ff on charcoal. Pink retired. ---- */
:root{--teal:#67f2ff;--orange:#ffc067;--pink:#fefffe;
  /* --blue* now carries the purple accent; --violet* carries the cyan-tinted secondary (Backup) */
  --blue:#7467ff;--blue-t:#d2ceff;--blue-bg:#2f2d52;
  --violet:#3f8f99;--violet-t:#67f2ff;--violet-bg:#1f3b41;--amber-bg:#443a22}
.row .t{color:var(--white)}
.panel h2{color:var(--white)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(100deg,#35316a 0%,#2a2d3c 100%);border:1px solid #47427f;border-radius:16px;padding:16px 20px;margin:8px 0 18px}
.banner .ti{min-width:0;font-size:calc(var(--chart)*.95);font-weight:700;line-height:1.1;color:var(--white);text-wrap:balance;overflow-wrap:anywhere}
.banner .ky{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--blue);color:#fff;border-radius:12px;padding:8px 16px;min-width:3.2em}
.banner .ky small{font-size:.7rem;letter-spacing:.14em;font-weight:700;opacity:.85}
.banner .ky b{font-size:calc(var(--chart)*.8);line-height:1.1;font-weight:700}
.pv .banner .ti{font-size:1.7rem}.pv .banner .ky b{font-size:1.5rem}
:root{--bg:#141a1f;--panel:#1c2329;--panel2:#262e36;--line:#333c45}

/* ---- v8 layout: toolbars stretch full width ---- */
header{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
#q{grid-column:1/-1;flex:none}
.seg{display:flex}
.seg button{flex:1;text-align:center}
.hbtn{padding-block:12px}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.bar .sp{display:none}
.bar button.sm{width:100%;padding:12px 8px}
@media (max-width:820px){
  .bar .back{grid-column:1/-1}
  .bar button.sm{padding:12px 4px;font-size:.95rem}
}
@media (max-width:520px){
  header{grid-template-columns:1fr 1fr}
  .seg{grid-column:1/-1}
}

/* ---- v9: app-level controls sit in a neutral panel; chart controls live inside the song's card ---- */
header{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
#q,.seg{background:var(--bg)}
@media (min-width:821px){.bar{margin-bottom:0}}
.card{border:1px solid #47427f;border-radius:16px;background:linear-gradient(100deg,#35316a 0%,#2a2d3c 100%);overflow:hidden;margin:0 0 18px}
.card .banner{background:none;border:0;border-radius:0;margin:0;padding:16px 20px}
.card .ctl{margin:0;padding:10px 12px 12px;background:rgba(13,18,22,.4);border-top:1px solid #47427f}
.card .ctl button.sm{background:rgba(255,255,255,.08);border-color:#4d4a86}
.card .ctl button.sm.edit{background:var(--blue);border-color:var(--blue);color:#fff}
.card .ctl button.sm[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--orange);color:var(--orange)}
.card .ctl button.sm{white-space:nowrap}
@media (max-width:820px){.card .ctl{grid-template-columns:1fr 1fr 1fr 1.6fr}}

/* ---- v10: key tile on the left, Spotify on the far right, condensed chart buttons ---- */
.banner{justify-content:flex-start}
.banner .ti{flex:1 1 auto}
.banner .pl{flex:0 1 340px;min-width:0;margin-left:auto}
.banner .pl:empty{display:none}
.banner:has(.pl iframe){padding-block:10px}
.card .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.card .ctl button.sm{width:auto;padding:10px 18px}
.card .ctl .spot{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#1db954;color:#07130b;font-weight:700;border:1px solid #1db954;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700}
.card .ctl button.sm.spot{background:#1db954;border-color:#1db954;color:#07130b}
@media (max-width:820px){.card .ctl button.sm,.card .ctl .spot{padding:10px 12px;font-size:.9rem}}

/* ---- v12: Spotify remote player in the banner ---- */
.banner:has(.pl > *){padding-block:10px}
.pl .pc{display:flex;flex-direction:column;gap:4px;width:100%}
.pl .prow{display:flex;align-items:center;gap:8px}
.pl .pb{background:rgba(255,255,255,.08);border:1px solid #4d4a86;color:var(--white);border-radius:10px;font:inherit;font-weight:500;padding:8px 12px;min-width:48px}
.pl .pb.main{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;min-width:72px}
.pl .ptime{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem;white-space:nowrap}
.pl .prange{width:100%;accent-color:var(--blue);height:26px;margin:0}
.pl .pnote{font-size:.8rem;color:var(--orange);line-height:1.1}
.pl .pnote:empty{display:none}
.pl .pcon{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.95rem}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
</style>
</head>
<body>


<header>
  <input id="q" type="search" placeholder="Search title, artist or key" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search songs">
  <div class="seg" role="group" aria-label="Show">
    <button id="m-all" type="button" aria-pressed="true">All <span id="n-all"></span></button>
    <button id="m-set" type="button" aria-pressed="false">Set <span id="n-set"></span></button>
  </div>
  <button id="b-new" class="hbtn" type="button">New</button>
  <button id="b-bak" class="hbtn" type="button">Backup</button>
</header>
<main>
  <nav id="list" aria-label="Songs"></nav>
  <section id="chart" aria-live="polite"></section>
</main>

}
function spPlayer(s,slot){
  spStop();slot.textContent='';
  const st={pos:0,dur:0,playing:false,at:Date.now(),drag:false,id:null};
  const wrap=el('div','pc'),row=el('div','prow'),note=el('div','pnote');
  const cur=()=>st.playing?Math.min(st.dur||1e9,st.pos+(Date.now()-st.at)):st.pos;
  const mine=()=>st.id===s.spotify;
  const pp=mk('Play',()=>toggle(),'pb main'),bk=mk('−10',()=>nudge(-10000),'pb'),fw=mk('+10',()=>nudge(10000),'pb');
  bk.setAttribute('aria-label','Back 10 seconds');fw.setAttribute('aria-label','Forward 10 seconds');
  const time=el('span','ptime','–:– / –:–');
  const rng=el('input','prange');rng.type='range';rng.min=0;rng.max=1000;rng.value=0;rng.setAttribute('aria-label','Seek');
  row.append(bk,pp,fw,time);wrap.append(row,rng,note);slot.append(wrap);
  const paint=()=>{
    pp.textContent=(mine()&&st.playing)?'Pause':'Play';
    if(!mine()||!st.dur){time.textContent='–:– / –:–';if(!st.drag)rng.value=0;return}
    const c=cur();time.textContent=fmtMs(c)+' / '+fmtMs(st.dur);if(!st.drag)rng.value=Math.round(c/st.dur*1000);
  };
  async function guard(fn){try{await fn()}catch(e){
    if(e.message==='noauth'||e.message==='401'){store.set(SPT,'');note.textContent='Spotify sign-in expired. Reconnect in Backup.'}
    else note.textContent='Couldn’t reach Spotify.'}}
  async function refresh(){
    const j=await spState();
    if(!j||!j.item){st.playing=false;st.id=null;paint();return}
    st.pos=j.progress_ms||0;st.dur=j.item.duration_ms||0;st.playing=!!j.is_playing;st.at=Date.now();st.id=j.item.id;paint();
    note.textContent=mine()?'':'Spotify is playing a different track.';
  }
  async function startTrack(){
    note.textContent='Starting…';const body={uris:['spotify:track:'+s.spotify]};
    let r=await spApi('PUT','/me/player/play',body);
    if(r.status===404){
      const dr=await spApi('GET','/me/player/devices');const ds=((await dr.json()).devices||[]).filter(x=>!x.is_restricted);
      const dev=ds.find(x=>x.is_active)||ds.find(x=>/tablet|smartphone/i.test(x.type))||ds[0];
      if(!dev){note.textContent='Open the Spotify app on this iPad, play anything, then tap Play again.';return}
      r=await spApi('PUT','/me/player/play?device_id='+encodeURIComponent(dev.id),body);
    }
    if(r.status===403){note.textContent='Spotify says playback control needs Premium.';return}
    if(!r.ok){note.textContent='Spotify couldn’t start that track.';return}
    note.textContent='';st.id=s.spotify;st.playing=true;st.pos=0;st.at=Date.now();paint();
    setTimeout(()=>guard(refresh),800);
  }
  async function toggle(){await guard(async()=>{
    if(!mine()){await startTrack();return}
    const was=st.playing,c=cur();
    const r=await spApi('PUT',was?'/me/player/pause':'/me/player/play');
    if(r.ok){st.pos=c;st.at=Date.now();st.playing=!was;paint()}
  })}
  async function seekTo(ms){await guard(async()=>{
    if(!mine())return;const to=Math.max(0,Math.min((st.dur||0)-500,Math.round(ms)));
    const r=await spApi('PUT','/me/player/seek?position_ms='+to);
    if(r.ok){st.pos=to;st.at=Date.now();paint()}
  })}
  const nudge=ms=>seekTo(cur()+ms);
  rng.oninput=()=>{st.drag=true;if(st.dur)time.textContent=fmtMs(rng.value/1000*st.dur)+' / '+fmtMs(st.dur)};
  rng.onchange=()=>{st.drag=false;seekTo(rng.value/1000*st.dur)};
  spTimers.push(setInterval(paint,250),setInterval(()=>guard(refresh),2000));
  guard(async()=>{await refresh();if(mine()){if(!st.playing){const r=await spApi('PUT','/me/player/play');if(r.ok){st.at=Date.now();st.playing=true;paint()}}}else await startTrack()});
}
function spotifyPanel(p){
  p.append(el('h2',null,'Spotify'));
  const connected=!!spTok();
  p.append(el('p',null,connected?'Connected. The Play button controls the Spotify app on this device.':'Not connected. Until you connect, the player only plays 30-second previews.'));
  if(spMsg){p.append(el('p','warn',spMsg));spMsg=''}
  const f=el('div','field'),l=el('label',null,'Spotify Client ID'),i=el('input','in');
  i.type='text';i.id='sp-client';l.htmlFor='sp-client';i.value=spClient();i.placeholder='Paste your Client ID';i.autocapitalize='off';i.autocomplete='off';i.spellcheck=false;
  i.oninput=()=>store.set(SPK,i.value.trim());f.append(l,i);p.append(f);
  const rf=el('div','field');rf.append(el('label',null,'Redirect URI to add in the Spotify dashboard'));
  const ri=el('input','in');ri.readOnly=true;ri.value=spRedirect();ri.setAttribute('aria-label','Redirect URI');rf.append(ri);p.append(rf);
  const act=el('div','tools');
  act.append(mk(connected?'Reconnect':'Connect Spotify',()=>{if(!spClient()){spMsg='Paste your Client ID first.';renderBackup();return}spConnect()},'sm primary'));
  if(connected)act.append(mk('Disconnect',()=>{store.set(SPT,'');renderBackup()}));
  p.append(act,el('p',null,'Setup: at developer.spotify.com/dashboard create an app (any name), add the redirect URI above, tick Web API, save, then paste its Client ID here and tap Connect. Playback control needs Spotify Premium, and the Spotify app must be open on this iPad.'));
}
/* ---------- editor ---------- */
const showText=t=>t.replace(/\t/g,' | ');
const readText=v=>v.split(/\s*\|\s*/).join('\t');
function renderEditor(){
  const box=$('chart');box.textContent='';
  if(draft.spotifyRaw===undefined)draft.spotifyRaw=draft.spotify?'https://open.spotify.com/track/'+draft.spotify:'';
  const isNew=!get(draft.id);
  backBar(box,isNew?'Cancel':'Cancel',isNew?'':'s-'+draft.id);
  const p=el('div','panel');
  p.append(el('h2',null,isNew?'New song':'Edit song'));
  const f=(label,val,ph,key)=>{const w=el('div','field');const l=el('label',null,label);const i=el('input','in');i.type='text';i.value=val;i.placeholder=ph||'';i.id='f-'+key;l.htmlFor=i.id;
    i.autocapitalize='off';i.autocomplete='off';i.spellcheck=false;i.oninput=()=>{draft[key]=i.value;renderPreview()};w.append(l,i);return w};
  p.append(f('Title',draft.title,'e.g. Wagon Wheel','title'),f('Key',draft.key,'e.g. A','key'),f('Also search for (artist, full title)',draft.alias,'optional','alias'),f('Spotify track link',draft.spotifyRaw,'Paste a Spotify track link (optional)','spotifyRaw'));
  const lab=el('div','field');lab.append(el('label',null,'Chart lines. Type a | between chords for a gap. Tap the circle to change colour.'));p.append(lab);
  draft.lines.forEach((ln,li)=>{
    const L=el('div','eline');
    ln.forEach((seg,si)=>{
      const r=el('div','seg-row');
      const sw=el('button','sw '+seg[0]);sw.type='button';sw.setAttribute('aria-label','Colour '+CNAME[seg[0]]+'. Tap to change.');
      sw.onclick=()=>{seg[0]=COLS[(COLS.indexOf(seg[0])+1)%3];renderEditor()};
      const i=el('input','in');i.type='text';i.value=showText(seg[1]);i.autocapitalize='off';i.autocomplete='off';i.spellcheck=false;i.setAttribute('aria-label','Line '+(li+1)+' part '+(si+1));
      i.oninput=()=>{seg[1]=readText(i.value);renderPreview()};
      r.append(sw,i);
      if(ln.length>1){const x=mk('✕',()=>{ln.splice(si,1);renderEditor()});x.setAttribute('aria-label','Remove this part');r.append(x)}
      L.append(r);
    });
    const tl=el('div','tools');
    tl.append(mk('+ part',()=>{ln.push([ln[ln.length-1][0],''],);renderEditor()}));
    if(li>0)tl.append(mk('↑',()=>{[draft.lines[li-1],draft.lines[li]]=[draft.lines[li],draft.lines[li-1]];renderEditor()}));
    if(li<draft.lines.length-1)tl.append(mk('↓',()=>{[draft.lines[li+1],draft.lines[li]]=[draft.lines[li],draft.lines[li+1]];renderEditor()}));
    tl.append(mk('Delete line',()=>{draft.lines.splice(li,1);if(!draft.lines.length)draft.lines.push([['t','']]);renderEditor()}));
    L.append(tl);p.append(L);
  });
  p.append(mk('+ Add line',()=>{const last=draft.lines[draft.lines.length-1];draft.lines.push([[last?last[last.length-1][0]:'t','']]);renderEditor()}));
  const msg=el('div','msg warn');msg.id='emsg';
  const act=el('div','tools');
  act.append(mk('Save',saveDraft,'sm primary'));
  act.append(mk('Cancel',()=>{location.hash=isNew?'':'s-'+draft.id}));
  if(!isNew)act.append(confirmBtn('Delete song','Tap again to delete',()=>{songs=songs.filter(s=>s.id!==draft.id);inSet.delete(draft.id);saveSet();changed();location.hash=''}));
  p.append(msg,act);
  const pv=el('div','pv');pv.id='pv';p.append(el('p',null,'Preview'),pv);
  box.append(p);renderPreview();box.scrollTop=0;
}
function renderPreview(){
  const pv=$('pv');if(!pv)return;pv.textContent='';
  pv.append(banner(draft.title||'Untitled',normKey(draft.key)));
  renderLines(pv,tidy(draft.lines));
}
const normKey=k=>{k=(k||'').trim();return k&&!k.startsWith('(')?'('+k+')':k};
const tidy=lines=>lines.map(l=>l.filter(s=>s[1]!=='')).filter(l=>l.length);
function saveDraft(){
  const m=$('emsg');
  if(!draft.title.trim()){m.textContent='Add a title first.';return}
  const rawSp=(draft.spotifyRaw||'').trim();const sp=parseSp(rawSp);
  if(rawSp&&!sp){m.textContent='That doesn’t look like a Spotify track link.';return}
  const s={id:draft.id,title:draft.title.trim(),key:normKey(draft.key),alias:draft.alias.trim(),spotify:sp,lines:tidy(draft.lines)};
  if(!s.lines.length){m.textContent='Add at least one chart line.';return}
  const i=songs.findIndex(x=>x.id===s.id);if(i>=0)songs[i]=s;else songs.push(s);
  changed();location.hash='s-'+s.id;
}
function confirmBtn(label,armed,fn){
  const b=el('button','sm danger',label);b.type='button';let t;
  b.onclick=()=>{if(b.dataset.armed){clearTimeout(t);fn()}else{b.dataset.armed='1';b.textContent=armed;t=setTimeout(()=>{delete b.dataset.armed;b.textContent=label},4000)}};
  return b;
}

/* ---------- backup ---------- */
async function copyText(ta){
  try{await navigator.clipboard.writeText(ta.value);return true}catch(e){}
  ta.focus();ta.select();try{return document.execCommand('copy')}catch(e){return false}
}
function renderBackup(){
  const box=$('chart');box.textContent='';backBar(box,'Songs','');
  const p=el('div','panel');p.append(el('h2',null,'Backup'));
  if(!storeOK)p.append(el('p','warn','This view can’t save changes. Edits will be lost when you close it.'));
  const when=meta.backedUp?new Date(meta.backedUp).toLocaleString():'never';
  p.append(el('p',null,songs.length+' songs. Changes since last backup: '+(meta.changes||0)+'. Last backup: '+when+'.'));
  p.append(el('p',null,'Your songs live in this browser only. Copy the backup below and paste it somewhere you keep, such as Notes. If the browser data is ever cleared, paste it back into Restore.'));
  const ta=el('textarea','in');ta.readOnly=true;ta.setAttribute('aria-label','Backup text');ta.value=JSON.stringify({app:'cover-chart-finder',version:2,songs});
  const m1=el('div','msg');
  const act=el('div','tools');
  act.append(mk('Copy backup',async()=>{
    if(await copyText(ta)){meta.backedUp=Date.now();meta.changes=0;persist();renderList();m1.textContent='Copied. Paste it into Notes or a file.';m1.className='msg'}
    else{m1.textContent='Couldn’t copy automatically. The text is selected: copy it by hand.';m1.className='msg warn'}
  },'sm primary'));
  p.append(ta,act,m1);
  p.append(el('h2',null,'Restore'));
  p.append(el('p',null,'Paste a backup here. Merge adds songs you don’t already have. Replace swaps your whole list.'));
  const ti=el('textarea','in');ti.placeholder='Paste backup text';ti.setAttribute('aria-label','Paste backup text');
  const m2=el('div','msg');
  const parse=()=>{try{let j=JSON.parse(ti.value);if(j&&!Array.isArray(j))j=j.songs;if(!Array.isArray(j))throw 0;const out=j.map(clean).filter(Boolean);if(!out.length)throw 0;return out}catch(e){m2.textContent='That isn’t a valid backup.';m2.className='msg warn';return null}};
  const a2=el('div','tools');
  a2.append(mk('Merge',()=>{const inc=parse();if(!inc)return;let add=0,skip=0;
      for(const s of inc){if(songs.some(x=>norm(x.title)===norm(s.title)&&norm(x.key)===norm(s.key))){skip++;continue}
        if(get(s.id))s.id=uid();songs.push(s);add++}
      if(add)changed();renderList();m2.className='msg';m2.textContent='Added '+add+', skipped '+skip+' already here.'}));
  a2.append(confirmBtn('Replace all','Tap again to replace',()=>{const inc=parse();if(!inc)return;songs=inc;inSet=new Set([...inSet].filter(id=>get(id)));saveSet();changed();renderList();m2.className='msg';m2.textContent='Replaced. '+songs.length+' songs.'}));
  p.append(ti,a2,m2);
  if(EMBED)spotifyPanel(p);
  p.append(el('h2',null,'Start over'));
  p.append(el('p',null,'Go back to the built-in list of 83 songs, as of the last time the app files were updated. This discards your edits.'));
  const m3=el('div','msg');
  p.append(confirmBtn('Reset to built-in songs','Tap again to reset',()=>{songs=baseCopy();inSet=new Set();saveSet();changed();renderList();m3.textContent='Reset.'}),m3);
  box.append(p);box.scrollTop=0;
}

/* ---------- routing ---------- */
function route(){
  spStop();
  const h=location.hash;let m;sel=null;pane='chart';
  if((m=/^#s-([a-z0-9]+)$/.exec(h))&&get(m[1]))sel=m[1];
  else if((m=/^#edit-([a-z0-9]+)$/.exec(h))&&get(m[1])){sel=m[1];pane='edit';draft=clone(get(m[1]));draft.lines=clone(draft.lines)}
  else if(h==='#new'){pane='edit';draft={id:uid(),title:'',key:'',alias:'',lines:[[['t','']]]}}
  else if(h==='#backup')pane='backup';
  document.body.dataset.view=(pane==='chart'&&!sel)?'list':'chart';
  renderList();
  if(pane==='edit')renderEditor();else if(pane==='backup')renderBackup();else renderChart();
}
function setMode(m){mode=m;$('m-all').setAttribute('aria-pressed',m==='all');$('m-set').setAttribute('aria-pressed',m==='set');renderList()}
$('q').addEventListener('input',e=>{q=e.target.value;renderList()});
$('m-all').onclick=()=>setMode('all');$('m-set').onclick=()=>setMode('set');
$('b-new').onclick=()=>{location.hash='new'};$('b-bak').onclick=()=>{location.hash='backup'};
addEventListener('hashchange',route);
load();route();if(EMBED)spHandleRedirect();
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
