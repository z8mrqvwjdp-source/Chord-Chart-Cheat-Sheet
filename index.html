<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: sticky search bar on top; landscape = song list left + big chart right; portrait/phone = list or chart, one at a time. Look follows the original Pages sheet: black, pink titles, teal / white / orange lines. */
:root{
  --bg:#000;--panel:#0d0d0f;--line:#26262b;--muted:#8d8d96;
  --pink:#ff42a1;--teal:#73fdea;--white:#fefffe;--orange:#feae00;
  --font:"Futura","Jost","Avenir Next",system-ui,sans-serif;
  --chart:2.6rem;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--white);font-family:var(--font);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{flex:1 1 220px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1.1rem}
#q::placeholder{color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:12px 16px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--white);color:#000}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px}
#list{overflow-y:auto;min-height:0;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.row .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:14px 4px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .t{color:var(--pink);font-weight:700;font-size:1.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .k{color:var(--white);font-weight:500;white-space:nowrap}
.row.sel{background:var(--panel)}
.row.sel .open{box-shadow:inset 3px 0 0 var(--pink);padding-left:12px}
.star{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted);font-size:.8rem;font-weight:500}
.star[aria-pressed="true"]{border-color:var(--orange);color:var(--orange)}
.empty{color:var(--muted);padding:24px 4px}
#chart{overflow-y:auto;min-height:0;min-width:0;padding-bottom:40px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.bar .back{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.bar .sp{flex:1}
.bar button.sm{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:500}
.bar button.sm[aria-pressed="true"]{border-color:var(--orange);color:var(--orange)}
.head{font-size:calc(var(--chart)*1.05);font-weight:700;line-height:1.15;text-wrap:balance;margin:8px 0 14px}
.head .t{color:var(--pink)}
.line{font-variant-numeric:tabular-nums;font-size:var(--chart);font-weight:700;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.c-t{color:var(--teal)}.c-w{color:var(--white)}.c-o{color:var(--orange);font-weight:500}.c-p{color:var(--pink)}
.tab{display:inline-block;width:1.7em}
.hint{color:var(--muted);font-size:1rem;padding:40px 4px}
@media (max-width:820px){
  body{overflow:auto;height:auto;min-height:100%}
  html,body{height:auto}
  main{display:block}
  #list{overflow:visible}
  body[data-view="chart"] #list,body[data-view="list"] #chart{display:none}
  .bar .back{display:inline-block}
  :root{--chart:2.1rem}
}
@media (max-width:820px) and (orientation:portrait){:root{--chart:1.9rem}}
@media (prefers-reduced-motion:no-preference){.row .open{transition:background .12s}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
</style>
</head>
<body>

  <div class="seg" role="group" aria-label="Show">
    <button id="m-all" type="button" aria-pressed="true">All <span id="n-all"></span></button>
    <button id="m-set" type="button" aria-pressed="false">Set <span id="n-set"></span></button>
  </div>
</header>
<main>
  <nav id="list" aria-label="Songs"></nav>
  <section id="chart" aria-live="polite"></section>

"title":"What I Like","key":"(C)","lines":[[["t","1\t4\tb7\t4"]]]},{"title":"Wonderballs","key":"(A)","lines":[[["t","6\t1\t5\t2"]],[["w","4\t5\t6\t6  "],["o","x 2"]],[["w","4\t5\t6 - 5 - 1 - 5 - 2"]],[["o","4\t6\t1\t6"]]]},{"title":"YMCA","key":"(F)","lines":[[["t","1\t6\t4\t"],["o","5-4-5-4-1-4"]],[["t","1\t6\t4\t"],["o","5-4-3-2-1-4"]],[["w","1\t6\t2\t4"]]]},{"title":"You May Be Right","key":"(A)","lines":[[["t","1\t1\t1\t6  "],["o","x 2"]],[["t","2\tb7\t5\t1"]],[["w","5 "],["o","(riff)"],["w","\t1 "],["o","(riff)"]],[["w","5\t4\t6\t1"]],[["w","5 "],["o","(riff)"],["w","\t1 "],["o","(riff)"]],[["w","4\t5\t1\t1"]]]}];
const ALIAS = {"Diamonds Souls": "Diamonds on the Soles of Her Shoes Paul Simon", "Watermelon Sug": "Watermelon Sugar Harry Styles", "Shut Up": "Shut Up and Dance Walk the Moon", "Only Wanna Be": "I Only Wanna Be With You", "Stuck Middle": "Stuck in the Middle With You Stealers Wheel", "Thinking Loud": "Thinking Out Loud Ed Sheeran", "Tip of Tongue": "Tip of My Tongue", "The Way Feel": "The Way You Make Me Feel", "Dumb Things": "Dumb Things Paul Kelly", "Obla Di": "Ob-La-Di Ob-La-Da Beatles", "Honkey Tonk": "Honky Tonk Women Rolling Stones", "Part Time": "Part Time Lover Stevie Wonder", "Walking Sunshine": "Walking on Sunshine Katrina", "Grapevine": "I Heard It Through the Grapevine Marvin Gaye", "Steal My Kisses": "Ben Harper", "Country Roads": "Take Me Home Country Roads John Denver", "Mr Jones": "Counting Crows", "Island Sun": "Island in the Sun Weezer", "Horses": "Daryl Braithwaite", "Wonderful World": "What a Wonderful World", "Crocodile": "Crocodile Rock Elton John", "Moonlight": "Moonlight Shadow Mike Oldfield", "Walk of Life": "Dire Straits", "Wagon Wheel": "Old Crow Medicine Show Darius Rucker", "Proud Mary": "Creedence Clearwater Revival", "Down Under": "Men at Work", "Levitating": "Dua Lipa", "Perfect": "Ed Sheeran", "Shape of You": "Ed Sheeran", "Happy": "Pharrell Williams"};
const norm = s => s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9#/ ]+/g,' ').replace(/\s+/g,' ').trim();
const sortKey = t => norm(t).replace(/^the /,'');
SONGS.forEach((s,i)=>{s.id=i; s.hay=norm(s.title+' '+s.key+' '+(ALIAS[s.title]||''));});
const ORDER = SONGS.map(s=>s.id).sort((a,b)=>sortKey(SONGS[a].title).localeCompare(sortKey(SONGS[b].title)) || a-b);

let store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let inSet=new Set(); try{inSet=new Set(JSON.parse(store.get('set')||'[]').filter(i=>SONGS[i]))}catch(e){}
let size=parseFloat(store.get('size'))||2.6; document.documentElement.style.setProperty('--chart',size+'rem');
let mode='all', sel=null, q='';

const $=id=>document.getElementById(id);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};

function visible(){
  const terms=norm(q).split(' ').filter(Boolean);
  return ORDER.filter(i=>(mode==='all'||inSet.has(i)) && terms.every(t=>SONGS[i].hay.includes(t)));
}
function saveSet(){store.set('set',JSON.stringify([...inSet]))}
function toggle(i){inSet.has(i)?inSet.delete(i):inSet.add(i);saveSet();renderList();if(sel===i)renderChart()}

function renderList(){
  const box=$('list'),keep=box.scrollTop;box.textContent='';
  const ids=visible();
  $('n-all').textContent=SONGS.length;$('n-set').textContent=inSet.size||'';
  if(!ids.length){box.append(el('div','empty',mode==='set'&&!inSet.size?'No songs in the set yet. Open a song and tap Add to set.':'No songs match.'));return}
  for(const i of ids){
    const s=SONGS[i],row=el('div','row'+(i===sel?' sel':''));
    const open=el('button','open');open.type='button';
    open.append(el('span','t',s.title),el('span','k',s.key));
    open.onclick=()=>show(i);
    const st=el('button','star',inSet.has(i)?'In set':'Add');st.type='button';
    st.setAttribute('aria-pressed',inSet.has(i));st.setAttribute('aria-label',(inSet.has(i)?'Remove ':'Add ')+s.title+(inSet.has(i)?' from set':' to set'));
    st.onclick=()=>toggle(i);
    row.append(open,st);box.append(row);
  }
  box.scrollTop=keep;
}

function renderChart(){
  const box=$('chart');box.textContent='';
  const bar=el('div','bar');
  const back=el('button','back','‹ Songs');back.type='button';back.onclick=()=>{location.hash='';};
  bar.append(back,el('span','sp'));
  const mk=(t,f)=>{const b=el('button','sm',t);b.type='button';b.onclick=f;return b};
  const sm=mk('A−',()=>resize(-0.2)),lg=mk('A+',()=>resize(0.2));sm.setAttribute('aria-label','Smaller text');lg.setAttribute('aria-label','Larger text');
  if(sel==null){box.append(bar,el('div','hint','Pick a song from the list.'));return}
  const s=SONGS[sel];
  const add=mk(inSet.has(sel)?'In set':'Add to set',()=>toggle(sel));add.setAttribute('aria-pressed',inSet.has(sel));
  bar.append(sm,lg,add);
  const head=el('div','head');head.append(el('span','t',s.title+' '),document.createTextNode(s.key));
  box.append(bar,head);
  for(const ln of s.lines){
    const d=el('div','line');
    for(const [c,t] of ln){
      const sp=el('span','c-'+c);
      t.split('\t').forEach((part,k)=>{if(k)sp.append(el('span','tab'));sp.append(document.createTextNode(part))});
      d.append(sp);
    }
    box.append(d);
  }
  box.scrollTop=0;
}
function resize(d){size=Math.min(5,Math.max(1.2,+(size+d).toFixed(2)));document.documentElement.style.setProperty('--chart',size+'rem');store.set('size',size)}

function show(i){location.hash='s-'+i}
function route(){
  const m=/^#s-(\d+)$/.exec(location.hash);
  sel=m&&SONGS[+m[1]]?+m[1]:null;
  document.body.dataset.view=sel==null?'list':'chart';
  renderList();renderChart();
}
function setMode(m){mode=m;$('m-all').setAttribute('aria-pressed',m==='all');$('m-set').setAttribute('aria-pressed',m==='set');renderList()}
$('q').addEventListener('input',e=>{q=e.target.value;renderList()});
$('m-all').onclick=()=>setMode('all');$('m-set').onclick=()=>setMode('set');
addEventListener('hashchange',route);
route();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
